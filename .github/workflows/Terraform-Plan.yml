name: "Terraform-plan-Infra-plan"

on:
  push:
    branches: 
      - Feature-Branch
  pull_request:
    branches:
      - main
      - Feature-Branch

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_ID }}
      AWS_REGION: 'eu-west-2'
        
    steps:
      - name: Checkout
        uses: actions/checkout@v3.1.0
             
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        id: init
        run: terraform init
        
      - name: Terraform Validate
        id: validate
        run: terraform validate

      # Fixed: Removed continue-on-error so step fails natively on bad TF syntax/credentials
      - name: Terraform Plan
        id: plan
        run: terraform plan
